; Snake on the two-USB CYD (ESP32-2432S028, USB-C + micro-USB, ST7789 display).
[env:cyd]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI is configured here, so there is no User_Setup.h to edit.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000

; Colours wrong? Change ONE thing at a time:
;   red food looks blue            -> TFT_RGB_ORDER=TFT_RGB
;   everything inverted / washed   -> replace TFT_INVERSION_OFF=1 with TFT_INVERSION_ON=1
;   still garbled                  -> swap ST7789_DRIVER for ILI9341_2_DRIVER and set TFT_INVERSION_ON=1
